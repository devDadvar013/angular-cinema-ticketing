<a class="card" [routerLink]="['/movies', movie().id]">
  <div class="poster" [style.background]="posterGradient()">
    <span class="age">{{ movie().ageRating }}</span>
    <span class="poster-title">{{ movie().title }}</span>
    <span class="poster-original">{{ movie().originalTitle }}</span>
  </div>

  <div class="meta">
    <h3 class="title">{{ movie().title }}</h3>
    <p class="original">{{ movie().originalTitle }}</p>

    <div class="stats">
      <span class="rating"><span class="star">★</span> {{ rating() }}</span>
      <span class="dot">•</span>
      <span>{{ duration() }}</span>
    </div>

    <div class="genres">
      @for (genre of movie().genres; track genre) {
        <span class="chip">{{ genre }}</span>
      }
    </div>
  </div>
</a>
